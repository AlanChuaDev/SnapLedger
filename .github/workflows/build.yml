name: Build APK
on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded zips and prepare signing key
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z" -x ".github/*" && rm "$z"; done
          if [ ! -f ci/release.jks ]; then
            mkdir -p ci
            keytool -genkeypair -keystore ci/release.jks -storepass snapledger -keypass snapledger -alias key -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=SnapLedger"
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update app files" && git push; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Build APK
        run: |
          flutter create --platforms=android --org com.snapledger --project-name snapledger /tmp/scaffold
          cp -r /tmp/scaffold/android android
          sed -i 's/android:label="[^"]*"/android:label="SnapLedger"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - name: Sign APK
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS sign --ks ci/release.jks --ks-pass pass:snapledger --key-pass pass:snapledger --out SnapLedger.apk build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SnapLedger latest
          files: SnapLedger.apk
