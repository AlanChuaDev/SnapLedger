name: snapledger
description: SnapLedger
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  share_plus: ^10.1.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/strings.json
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
